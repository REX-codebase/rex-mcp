name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    name: Rust (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tauri system prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      # The preview/capture integration tests drive a real headless browser
      # (BrowserRuntime probes google-chrome/chromium on PATH).
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
      - name: Expose Chrome on PATH for the test suite
        run: sudo ln -sf "${{ steps.setup-chrome.outputs.chrome-path }}" /usr/local/bin/google-chrome && google-chrome --version
      # tauri::generate_context!() panics at compile time when frontendDist
      # is missing; the frontend job builds the real dist in parallel, so
      # the Rust job only needs the path to exist for clippy/test.
      - name: Stub frontend dist for Tauri context macro
        run: mkdir -p dist
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  frontend:
    name: Frontend (test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
