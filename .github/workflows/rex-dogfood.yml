# Dogfood: REX checks its own roadmap honesty.
#
# Runs weekly and on demand. The agent gets a copy of the repo and a
# read-only brief: verify ROADMAP.md claims against the code, report gaps.
# It cannot touch the checkout (it only ever sees a copy) and cannot push.
#
# Required secret: ANTHROPIC_API_KEY (or change provider + secret below).

name: rex-dogfood

on:
  schedule:
    - cron: '0 6 * * 1' # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  roadmap-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./actions/rex-run
        with:
          task: >
            Read ROADMAP.md. For each Phase 0 and Phase 1 item marked done,
            verify the code actually exists and works (run the relevant
            tests if cheap). List every claim you cannot verify as a GAP
            with file:line evidence. Do not modify anything.
          provider: 'anthropic'
          api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          max-steps: '60'
          timeout-secs: '1800'
