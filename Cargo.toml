[workspace]
resolver = "2"
members = ["crates/rex-custody", "crates/rex-protocol", "crates/rex-daemon", "crates/rex-mcp", "crates/rex-prompt", "crates/rex-providers", "crates/rex-search", "crates/rex-tools", "crates/rex-mcp-ext", "crates/rex-preview", "crates/rex-ultra", "crates/rex-installed-agents", "crates/rex-fable", "crates/rex-cli", "src-tauri", "examples/rex-ultra-scripted-host"]

