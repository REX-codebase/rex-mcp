[package]
name = "rex-tools"
version = "0.1.0"
edition = "2021"
description = "Capability-scoped local tool runtime for REX Harness"
license = "Proprietary"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
regex = "1"
toml = "0.9"
libc = "0.2"
# Full Rust syntax check after writes (already in Cargo.lock via serde).
syn = { version = "2", default-features = false, features = ["full", "parsing"] }
proc-macro2 = { version = "1", default-features = false, features = ["span-locations"] }
saphyr-parser = "0.1"
