name: 'REX run'
description: 'Run a REX harness agent task headlessly. Fails the job unless the run completes.'

inputs:
  task:
    description: 'Task description for the agent'
    required: true
  provider:
    description: 'Model provider id (gemini, anthropic, openai, xai, deepseek, kimi, kimi-coding, qwen, glm, local)'
    required: false
    default: 'anthropic'
  model:
    description: 'Model id (default: provider default)'
    required: false
    default: ''
  api-key:
    description: 'Provider API key (use a secret)'
    required: true
  workspace:
    description: 'Directory to give the agent a copy of (default: the checked-out repo)'
    required: false
    default: '.'
  max-steps:
    description: 'Step budget'
    required: false
    default: '40'
  max-tool-calls:
    description: 'Tool-call budget'
    required: false
    default: '200'
  timeout-secs:
    description: 'Wall-clock budget in seconds'
    required: false
    default: '1200'
  rex-ref:
    description: 'REX harness ref to build the CLI from'
    required: false
    default: 'main'
  github-token:
    description: 'Token used to post the proof summary (check run + PR comment)'
    required: false
    default: ${{ github.token }}
  post-summary:
    description: 'Post the proof-replay summary as a check run and PR comment'
    required: false
    default: 'true'

# Required permissions on the calling workflow (GITHUB_TOKEN):
#   checks: write         # the "verified by REX" check run
#   pull-requests: write   # the proof-replay PR comment
#   actions: read          # not needed; the bundle links the workflow run

outputs:
  receipt:
    description: 'Path to the JSON run receipt'
    value: ${{ steps.run.outputs.receipt }}
  run-id:
    description: 'REX run id'
    value: ${{ steps.run.outputs.run-id }}
  status:
    description: 'Terminal agent status (completed when the step succeeds)'
    value: ${{ steps.run.outputs.status }}

runs:
  using: 'composite'
  steps:
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable

    - name: Cache cargo
      uses: Swatinem/rust-cache@v2
      with:
        workspaces: rex-harness -> target

    - name: Check out REX harness
      uses: actions/checkout@v4
      with:
        repository: REX-codebase/rex-harness
        ref: ${{ inputs.rex-ref }}
        path: rex-harness

    - name: Build rex CLI
      shell: bash
      working-directory: rex-harness
      run: cargo build --release -p rex-cli

    - name: Run task
      id: run
      shell: bash
      env:
        REX_STATE_DIR: ${{ runner.temp }}/rex-state
        # Bound via env: so the secret never touches shell text (no quoting or
        # injection issues). The CLI also accepts REX_<PROVIDER>_API_KEY.
        REX_API_KEY: ${{ inputs.api-key }}
      run: |
        set -euo pipefail
        args=(exec --yes --json --provider "${{ inputs.provider }}" --task "${{ inputs.task }}")
        [ -n "${{ inputs.model }}" ] && args+=(--model "${{ inputs.model }}")
        args+=(--workspace "${{ inputs.workspace }}")
        args+=(--max-steps "${{ inputs.max-steps }}")
        args+=(--max-tool-calls "${{ inputs.max-tool-calls }}")
        args+=(--timeout-secs "${{ inputs.timeout-secs }}")
        "$GITHUB_WORKSPACE/rex-harness/target/release/rex" "${args[@]}" | tee "$RUNNER_TEMP/rex-receipt.json"
        {
          echo "receipt=$RUNNER_TEMP/rex-receipt.json"
          echo "run-id=$(jq -r .run_id "$RUNNER_TEMP/rex-receipt.json")"
          echo "status=$(jq -r .status "$RUNNER_TEMP/rex-receipt.json")"
        } >> "$GITHUB_OUTPUT"
        # Fail the job unless the run actually completed.
        [ "$(jq -r .status "$RUNNER_TEMP/rex-receipt.json")" = "completed" ]

    - name: Verify receipt signature
      shell: bash
      env:
        REX_STATE_DIR: ${{ runner.temp }}/rex-state
      run: |
        "$GITHUB_WORKSPACE/rex-harness/target/release/rex" verify "$RUNNER_TEMP/rex-receipt.json"

    - name: Upload receipt
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: rex-receipt
        path: ${{ runner.temp }}/rex-receipt.json

    - name: Proof replay
      id: replay
      if: always() && inputs.post-summary == 'true'
      shell: bash
      env:
        REX_STATE_DIR: ${{ runner.temp }}/rex-state
      run: |
        set -uo pipefail
        # The replay report is the verdict carrier; its exit code (3 on
        # failure) must not fail this step — proof_summary.py decides.
        "$GITHUB_WORKSPACE/rex-harness/target/release/rex" replay \
          "$RUNNER_TEMP/rex-receipt.json" --json \
          | tee "$RUNNER_TEMP/rex-replay.json" || true
        [ -s "$RUNNER_TEMP/rex-replay.json" ] || echo '{}' > "$RUNNER_TEMP/rex-replay.json"

    - name: Post proof summary
      if: always() && inputs.post-summary == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        REX_BUNDLE_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        set -euo pipefail
        out="$RUNNER_TEMP/rex-proof"
        REX_BUNDLE_URL="$REX_BUNDLE_URL" python3 \
          "$GITHUB_ACTION_PATH/proof_summary.py" \
          "$RUNNER_TEMP/rex-receipt.json" "$RUNNER_TEMP/rex-replay.json" "$out"
        conclusion=$(jq -r .conclusion "$out/verdict.json")
        title=$(jq -r .title "$out/verdict.json")

        # "verified by REX" check run, with a link to the run bundle
        # (the receipt artifact lives on the workflow run page).
        gh api --method POST "repos/${{ github.repository }}/check-runs" \
          -f name="verified by REX" \
          -f head_sha="${{ github.sha }}" \
          -f status="completed" \
          -f conclusion="$conclusion" \
          -f "output[title]=$title" \
          -F "output[summary]=@$out/summary.md" \
          --jq .id

        # Proof-replay summary on the PR: create once, update after.
        pr="${{ github.event.pull_request.number }}"
        if [ -n "$pr" ]; then
          existing=$(gh api "repos/${{ github.repository }}/issues/$pr/comments" \
            --jq '[.[] | select(.body | contains("<!-- rex-proof-summary -->")) | .id] | first // empty')
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F "body=<$out/summary.md" --jq .id
          else
            gh api --method POST "repos/${{ github.repository }}/issues/$pr/comments" \
              -F "body=<$out/summary.md" --jq .id
          fi
        fi
