[package]
name = "rex-harness"
version = "0.1.0"
description = "REX Harness - desktop interface for the REX general agent"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { workspace = true }
serde_json = { workspace = true }
rex-providers = { path = "../crates/rex-providers" }
rex-search = { path = "../crates/rex-search" }
rex-tools = { path = "../crates/rex-tools" }

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
